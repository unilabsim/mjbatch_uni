[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=2.2.0", "mujoco-core==4.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "mjbatch-uni"
version = "0.3.0"
description = "A Python library for running thousands of MuJoCo simulations in parallel on CPU (unilabsim fork)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Kevin Zakka", email = "zakka@berkeley.edu" },
  { name = "Yufei Jia", email = "jyf23@mails.tsinghua.edu.cn" },
]
keywords = ["mujoco", "physics", "simulation", "batched", "reinforcement-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = ["mujoco==4.0.1", "numpy"]

[project.urls]
Homepage = "https://github.com/unilabsim/mjbatch_uni"
Repository = "https://github.com/unilabsim/mjbatch_uni"
Issues = "https://github.com/unilabsim/mjbatch_uni/issues"

[dependency-groups]
dev = ["pytest", "ruff", "pyright", "nanobind>=2.2.0"]
examples = [
  "mediapy",
  "mujoco-menagerie>=2026.9.0",
  "torch==2.9.0",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/mjbatch"]
wheel.exclude = ["mjbatch/csrc"]
sdist.inclusion-mode = "explicit"
sdist.include = ["src", "CMakeLists.txt", "LICENSE", "README.md", "pyproject.toml"]
sdist.exclude = ["__pycache__"]

[tool.ruff]
indent-width = 2
line-length = 110
exclude = [".venv", "build", "typings", "*.pyi"]
src = ["src", "tests", "benchmarks", "examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests"]
extraPaths = ["examples", "lab"]
stubPath = "typings"
reportMissingModuleSource = false
executionEnvironments = [{ root = "examples", reportOptionalSubscript = false }]

[tool.ty.environment]
extra-paths = ["typings"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *_i686"
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.cibuildwheel.linux]
repair-wheel-command = "auditwheel repair --exclude libmujoco.so.4.0.1 -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
repair-wheel-command = "delocate-wheel --ignore-missing-dependencies --exclude libmujoco.4.0.1.dylib --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.uv.sources]
# CUDA wheels built against the 12.8 driver on the Linux boxes; PyPI's default torch
# targets a newer driver and fails to initialize CUDA there. macOS keeps PyPI's wheel.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
